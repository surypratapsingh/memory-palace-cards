<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Palace - Decor Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
      }
      button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #1e293b;
        color: #f8fafc;
        cursor: pointer;
      }
      button:hover {
        background: #334155;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }
      #stats {
        font-family: monospace;
        font-size: 13px;
        color: #cbd5e1;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="btn-overview" type="button">Overview</button>
      <span id="room-buttons"></span>
      <label>
        <input id="chk-boxes" type="checkbox" />
        Show boxes
      </label>
      <span id="stats">calls: 0 | triangles: 0</span>
    </div>
    <script type="module" src="/src/scene/decor-demo.ts"></script>
  </body>
</html>
