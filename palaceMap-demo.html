<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Palace — Palace Map Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/palaceMap.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg, #0b0f19);
        color: var(--text, #f8fafc);
        font-family: system-ui, -apple-system, sans-serif;
      }
      .demo-header {
        margin-bottom: 20px;
      }
      .demo-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .demo-btn {
        background: var(--panel, #1e293b);
        color: var(--text, #f8fafc);
        border: 1px solid var(--border, #334155);
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      .demo-btn:hover {
        background: #334155;
      }
      .map-wrapper {
        border: 1px solid var(--border, #334155);
        border-radius: 8px;
        padding: 16px;
        background: #0f172a;
        margin-bottom: 20px;
      }
      #map-container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }
      #status-log {
        margin-top: 12px;
        font-size: 14px;
        color: var(--muted, #94a3b8);
      }
    </style>
  </head>
  <body>
    <div class="demo-header">
      <h1>Palace Map Demo (T18)</h1>
      <p>Interactive top-down SVG map of the 4 rooms, 52 loci, doors, and route.</p>
    </div>
    <div class="demo-controls">
      <button id="btn-toggle-color-safe" class="demo-btn">Toggle Color-Safe</button>
      <button id="btn-toggle-numbers" class="demo-btn">Toggle Numbers</button>
      <button id="btn-random-heat" class="demo-btn">Random Heat</button>
      <button id="btn-cycle-highlight" class="demo-btn">Step Highlight</button>
      <button id="btn-set-320" class="demo-btn">Width: 320px</button>
      <button id="btn-set-900" class="demo-btn">Width: 900px</button>
      <button id="btn-set-full" class="demo-btn">Width: 100%</button>
    </div>
    <div class="map-wrapper">
      <div id="map-container"></div>
      <div id="status-log">Selected locus: 1 (Grand grandfather clock, Library)</div>
    </div>
    <script type="module" src="/src/ui/palaceMap-demo.ts"></script>
  </body>
</html>
