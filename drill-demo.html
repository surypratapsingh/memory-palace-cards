<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Palace — 3D Drill Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/drill.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg, #0b0f19);
        color: var(--text, #f8fafc);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #scene-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #drill-root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #demo-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 60;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border, #334155);
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(8px);
        font-size: 0.85rem;
      }
      #demo-controls select {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid var(--border, #334155);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      #demo-controls label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="drill-root"></div>
    <div id="demo-controls">
      <strong>Drill Demo</strong>
      <label>
        Level:
        <select id="level-select">
          <option value="0">Level 0 (3 cards)</option>
          <option value="1">Level 1 (5 cards)</option>
          <option value="2">Level 2 (8 cards)</option>
          <option value="3">Level 3 (13 cards)</option>
          <option value="4">Level 4 (20 cards)</option>
          <option value="5">Level 5 (26 cards)</option>
          <option value="6">Level 6 (39 cards)</option>
          <option value="7">Level 7 (52 cards)</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="daily-check" />
        Daily
      </label>
      <button type="button" id="btn-restart" class="drill-btn">Restart</button>
      <button type="button" id="btn-unmount" class="drill-btn">Unmount</button>
    </div>
    <script type="module" src="/src/ui/drill-demo.ts"></script>
  </body>
</html>
